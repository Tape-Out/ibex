  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_hamming_72_64_dec.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_hamming_72_64_enc.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_hamming_76_68_dec.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_hamming_76_68_enc.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_22_16_dec.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_22_16_enc.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_28_22_dec.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_28_22_enc.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_39_32_dec.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_39_32_enc.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_64_57_dec.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_64_57_enc.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_72_64_dec.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_72_64_enc.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_hamming_22_16_dec.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_hamming_22_16_enc.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_hamming_39_32_dec.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_hamming_39_32_enc.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_hamming_72_64_dec.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_hamming_72_64_enc.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_hamming_76_68_dec.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_hamming_76_68_enc.sv
  - third_party/ibex/vendor/pulp_common_cells/rtl/stream_fork.sv
  - third_party/ibex/vendor/pulp_common_cells/rtl/stream_join_dynamic.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim_generic/rtl/prim_buf.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim_generic/rtl/prim_clock_gating.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim_generic/rtl/prim_ram_1p_pkg.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim_generic/rtl/prim_clock_mux2.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_fifo_sync.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim_generic/rtl/prim_flop.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_prince.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim_generic/rtl/prim_ram_1p.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_subst_perm.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_fifo_sync_cnt.sv
  defines:
  - SYNTHESIS
  includes:
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl
  - third_party/ibex/vendor/lowrisc_ip/dv/sv/dv_utils
  params:
    BaseIsa: baseIsa
    BranchPredictor: branchPredictor
    BranchTargetALU: branchTargetALU
    CheriotRevBitmapAddrWidth: cheriotRevBitmapAddrWidth
    CheriotRevBitmapBaseAddr: cheriotRevBitmapBaseAddr
    CsrMimpId: csrMimpId
    CsrMvendorId: csrMvendorId
    DbgHwBreakNum: dbgHwBreakNum
    DbgTriggerEn: dbgTriggerEn
    DmAddrMask: dmAddrMask
    DmBaseAddr: dmBaseAddr
    DmExceptionAddr: dmExceptionAddr
    DmHaltAddr: dmHaltAddr
    ICache: iCache
    ICacheECC: iCacheECC
    ICacheScrNumPrinceRoundsHalf: iCacheScrNumPrinceRoundsHalf
    ICacheScramble: iCacheScramble
    ICacheTweakInfection: iCacheTweakInfection
    LockstepOffset: lockstepOffset
    MHPMCounterNum: mhpmCounterNum
    MHPMCounterWidth: mhpmCounterWidth
    MemDataWidth: memDataWidth
    MemECC: memECC
    PMPEnable: pmpEnable
    PMPGranularity: pmpGranularity
    PMPNumRegions: pmpNumRegions
    PMPRstMsecCfg: pmpRstMsecCfg
    RV32B: rv32B
    RV32E: rv32E
    RV32M: rv32M
    RV32ZC: rv32ZC
    RegFile: regFile
    RndCnstLfsrSeed: rndCnstLfsrSeed
    SecureIbex: secureIbex
    WritebackStage: writebackStage
  clock:
    port: clk_i
  reset:
    port: rst_ni
    active: low
    sync: true
  ports:
  # 取指与访存各一条 Ibex 自己的简单存储协议：req/gnt/rvalid，不是 AXI
  - endpoint: instr
    kind: transaction
    role: manager
    profile: ibex-mem
    prefix: instr_
  - endpoint: data
    kind: transaction
    role: manager
    profile: ibex-mem
    prefix: data_
  - endpoint: irq
    kind: event
    role: sink
    prefix: irq_
  # 安全告警：SecureIbex 打开时才有内容，端口一直在
  - endpoint: alert
    kind: event
    role: source
    prefix: alert_
  # 指令缓存的 SRAM 配置引脚，交给实现存储的那一方
  - endpoint: ram
    kind: physical
    type: IbexRamCfg
    prefix: ram_cfg_
  # 取指扰码的密钥请求，iCacheScramble 打开时才用
  - endpoint: scramble
    kind: transaction
    role: manager
    profile: ibex-scramble
    prefix: scramble_
  # CHERIoT 的撤销位图通路，cheriotEnableI 为真时才走
  - endpoint: trvk
    kind: transaction
    role: manager
    profile: cheriot-revocation
    prefix: trvk_
  - endpoint: pins
    kind: physical
    type: IbexPins
    map:
      bootAddrI: boot_addr_i
      cheriotEnableI: cheriot_enable_i
      coreSleepO: core_sleep_o
      crashDumpO: crash_dump_o
      debugReqI: debug_req_i
      doubleFaultSeenO: double_fault_seen_o
      fetchEnableI: fetch_enable_i
      hartIdI: hart_id_i
      lockstepCmpEnO: lockstep_cmp_en_o
      mcounterenWritableI: mcounteren_writable_i
      scanRstNi: scan_rst_ni
      testEnI: test_en_i
  limits:
  - 存储口是 Ibex 自己的 req/gnt/rvalid，不是 AXI；要挂总线得在外面加桥
  - rvfi 那组端口要 RVFI 宏才存在，本声明不含
  - PMP 的复位配置与三个随机常数是数组，不是标量，留在默认值上
test:
  # 上游没有预编译的固件：examples/simple_system 要 RISC-V 工具链现编。
  # 所以这一版没有上游测试，只有逐点展开与声明回执。工具链接上再补
  noarea:
  - baseIsa
  - cheriotRevBitmapAddrWidth
  - cheriotRevBitmapBaseAddr
  - csrMimpId
  - csrMvendorId
  - dbgHwBreakNum
  - dmAddrMask
  - dmBaseAddr
targets:
  foreign:
    driver: foreign
