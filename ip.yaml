name: ibex
version: 0.1.0
spec: '0.1'
kind: ip
lang: sv
identity:
  slug: ibex-tapeout-foreign
  display_name: Ibex
  summary: lowRISC's RV32 core, the one inside OpenTitan, taken as a black box.
  category: processor
  subcategories:
  - riscv
  ip_family: ibex
  integration_profile: []
  maturity: planned
contract:
  version: 1
  ctrl:
    shape: none
    aw: 32
    dw: 32
params:
  # 这 5 个不是标量，本版留在默认值上：
  #   PMPRstAddr = [34'h0,34'h0,34'h0,34'h0,34'h0,34'h0,34'
  #   PMPRstCfg = [6'b0,6'b0,6'b0,6'b0,6'b0,6'b0,6'b0,6'b0
  #   RndCnstIbexKey = 128'h14e8cecae3040d5e12286bb3cc113298
  #   RndCnstIbexNonce = 64'hf79780bc735f3843
  #   RndCnstLfsrPerm = 160'd17247228450594708593364553037701681
  baseIsa:
    type: choice
    values:
    - BaseIsaRV32I
    - BaseIsaRV32IorCHERIoT
    default: BaseIsaRV32I
  cheriotRevBitmapAddrWidth:
    type: int
    default: 11
  cheriotRevBitmapBaseAddr:
    type: int
    default: 0
  csrMimpId:
    type: int
    default: 0
  csrMvendorId:
    type: int
    default: 0
  dbgHwBreakNum:
    type: int
    default: 1
  dmAddrMask:
    type: int
    default: 4095
  dmBaseAddr:
    type: int
    default: 437321728
  dmExceptionAddr:
    type: int
    default: 437323784
  dmHaltAddr:
    type: int
    default: 437323776
  iCacheScrNumPrinceRoundsHalf:
    type: int
    default: 2
  lockstepOffset:
    type: int
    default: 1
  mhpmCounterNum:
    type: int
    default: 0
  mhpmCounterWidth:
    type: int
    default: 40
  memDataWidth:
    type: int
    default: 32
  pmpGranularity:
    type: int
    default: 0
  pmpNumRegions:
    type: int
    default: 4
  pmpRstMsecCfg:
    type: int
    default: 0
  rv32B:
    type: choice
    values:
    - RV32BNone
    - RV32BBalanced
    - RV32BOTEarlGrey
    - RV32BFull
    default: RV32BNone
  rv32M:
    type: choice
    values:
    - RV32MNone
    - RV32MSlow
    - RV32MFast
    - RV32MSingleCycle
    default: RV32MFast
  rv32ZC:
    type: choice
    values:
    - RV32Zca
    - RV32ZcaZcb
    - RV32ZcaZcmp
    - RV32ZcaZcbZcmp
    default: RV32ZcaZcbZcmp
  regFile:
    type: choice
    values:
    - RegFileFF
    - RegFileFPGA
    - RegFileLatch
    default: RegFileFF
  rndCnstLfsrSeed:
    type: int
    default: 2891135988
features:
  branchPredictor:
    type: bool
    default: false
  branchTargetALU:
    type: bool
    default: false
  dbgTriggerEn:
    type: bool
    default: false
  iCache:
    type: bool
    default: false
  iCacheECC:
    type: bool
    default: false
  iCacheScramble:
    type: bool
    default: false
  iCacheTweakInfection:
    type: bool
    default: false
  memECC:
    type: bool
    default: false
  pmpEnable:
    type: bool
    default: false
  rv32E:
    type: bool
    default: false
  secureIbex:
    type: bool
    default: false
  writebackStage:
    type: bool
    default: false
emit:
- kind: foreign
  lang: sv
  top: ibex_top
  rtl:
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_count_pkg.sv
  - third_party/ibex/rtl/ibex_cheriot_pkg.sv
  - third_party/ibex/rtl/ibex_pkg.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_cipher_pkg.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_mubi_pkg.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_pkg.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_util_pkg.sv
  - third_party/ibex/rtl/ibex_alu.sv
  - third_party/ibex/rtl/ibex_branch_predict.sv
  - third_party/ibex/rtl/ibex_cheriot_ex.sv
  - third_party/ibex/rtl/ibex_compressed_decoder.sv
  - third_party/ibex/rtl/ibex_controller.sv
  - third_party/ibex/rtl/ibex_core.sv
  - third_party/ibex/rtl/ibex_counter.sv
