  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_flop_macros.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_lfsr.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_mubi12_dec.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_mubi12_sender.sv
  - third_party/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_mubi12_sync.sv
